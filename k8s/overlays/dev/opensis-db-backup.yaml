apiVersion: v1
kind: ServiceAccount
metadata:
  name: opensis-db-backup
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opensis-db-backup-storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opensis-db-backup-config
data:
  backup.sh: |
    #!/usr/bin/env sh
    set -eu

    SECRETS_FILE="${SECRETS_FILE:-/run/secrets/db.env}"
    BACKUP_DIR="${BACKUP_DIR:-/backup}"
    KEEP_BACKUPS="${KEEP_BACKUPS:-7}"
    DUMP_HOST="${DUMP_HOST:-opensis-db}"
    DUMP_PORT="${DUMP_PORT:-3306}"
    TIMESTAMP="$(date -u +%Y%m%dT%H%M%SZ)"
    ARCHIVE="${BACKUP_DIR}/opensis-${TIMESTAMP}.sql.gz"

    until [ -s "$SECRETS_FILE" ]; do
      sleep 2
    done

    set -a
    . "$SECRETS_FILE"
    set +a

    mkdir -p "$BACKUP_DIR"

    mysqldump \
      --host="$DUMP_HOST" \
      --port="$DUMP_PORT" \
      --user=root \
      --password="$MYSQL_ROOT_PASSWORD" \
      --single-transaction \
      --quick \
      --routines \
      --triggers \
      --events \
      --databases "$MYSQL_DATABASE" \
      | gzip -9 > "$ARCHIVE"

    if [ ! -s "$ARCHIVE" ]; then
      echo "ERROR: backup archive was not created or is empty" >&2
      rm -f "$ARCHIVE"
      exit 1
    fi

    if ! gzip -dc "$ARCHIVE" | grep -Eq '^USE `|^CREATE TABLE `|^INSERT INTO `|^CREATE DATABASE '; then
      echo "ERROR: backup archive does not contain expected schema or data markers" >&2
      rm -f "$ARCHIVE"
      exit 1
    fi

    keep="${KEEP_BACKUPS:-7}"
    if [ "${keep}" -gt 0 ] 2>/dev/null; then
      ls -1t "$BACKUP_DIR"/opensis-*.sql.gz 2>/dev/null | tail -n +"$((keep + 1))" | xargs -r rm -f
    fi

    echo "Backup written to $ARCHIVE"
    ls -lh "$BACKUP_DIR"/opensis-*.sql.gz 2>/dev/null || true
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: opensis-db-backup
spec:
  schedule: "0 2 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: opensis-db-backup
            backup-role: state-backup
        spec:
          serviceAccountName: opensis-db-backup
          restartPolicy: OnFailure
          volumes:
            - name: backup-script
              configMap:
                name: opensis-db-backup-config
                defaultMode: 0755
            - name: backup-storage
              persistentVolumeClaim:
                claimName: opensis-db-backup-storage
            - name: db-secrets
              secret:
                secretName: opensis-db-secrets
                items:
                  - key: db.env
                    path: db.env
          containers:
            - name: mariadb-backup
              image: mariadb:10.11.7
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - /usr/local/bin/backup.sh
              env:
                - name: BACKUP_DIR
                  value: /backup
                - name: KEEP_BACKUPS
                  value: "7"
                - name: DUMP_HOST
                  value: opensis-db
                - name: DUMP_PORT
                  value: "3306"
              volumeMounts:
                - name: backup-script
                  mountPath: /usr/local/bin/backup.sh
                  subPath: backup.sh
                - name: backup-storage
                  mountPath: /backup
                - name: db-secrets
                  mountPath: /run/secrets
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opensis-db-backup
spec:
  podSelector:
    matchLabels:
      app: opensis-db-backup
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: opensis-db
      ports:
        - protocol: TCP
          port: 3306
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
