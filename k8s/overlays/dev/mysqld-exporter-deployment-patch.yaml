apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysqld-exporter
spec:
  template:
    metadata:
      annotations:
        vault.hashicorp.com/role: "opensis-mysqld-exporter-dev"
        vault.hashicorp.com/agent-inject-secret-db.env: "kv/data/dev/opensis-db"
        vault.hashicorp.com/agent-inject-template-db.env: |
          {{- with secret "kv/data/dev/opensis-db" -}}
          MYSQL_ROOT_PASSWORD={{ .Data.data.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE={{ .Data.data.MYSQL_DATABASE }}
          MYSQL_USER={{ .Data.data.MYSQL_USER }}
          MYSQL_PASSWORD={{ .Data.data.MYSQL_PASSWORD }}
          {{- end }}
