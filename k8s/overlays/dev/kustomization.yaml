apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: opensis-dev
resources:
  - ../../base
patches:
  - path: opensis-ui-configmap-patch.yaml
  - path: opensis-ui-deployment-patch.yaml
  - path: opensis-db-statefulset-patch.yaml
  - path: opensis-ui-ingress-patch.yaml
  - path: opensis-db-backup-cronjob-patch.yaml
  - path: opensis-db-backup-pvc-patch.yaml
  - path: kube-state-metrics-clusterrolebinding-patch.yaml
  - path: mysqld-exporter-deployment-patch.yaml
  - path: alertmanager-deployment-patch.yaml
  - path: grafana-deployment-patch.yaml
images:
  - name: docker.io/eseosaiyangbe/opensis-ui
    newName: opensis-ui
    newTag: dev
