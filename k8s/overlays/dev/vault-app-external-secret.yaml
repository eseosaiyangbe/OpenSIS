apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opensis-app-secrets-external
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: opensis-app-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        app.env: |
          DB_HOST={{ .DB_HOST }}
          DB_PORT={{ .DB_PORT }}
          MYSQL_DATABASE={{ .MYSQL_DATABASE }}
          MYSQL_USER={{ .MYSQL_USER }}
          MYSQL_PASSWORD={{ .MYSQL_PASSWORD }}
  data:
    - secretKey: DB_HOST
      remoteRef:
        key: devops-easy-learning/opensis/dev/app
        property: DB_HOST
    - secretKey: DB_PORT
      remoteRef:
        key: devops-easy-learning/opensis/dev/app
        property: DB_PORT
    - secretKey: MYSQL_DATABASE
      remoteRef:
        key: devops-easy-learning/opensis/dev/app
        property: MYSQL_DATABASE
    - secretKey: MYSQL_USER
      remoteRef:
        key: devops-easy-learning/opensis/dev/app
        property: MYSQL_USER
    - secretKey: MYSQL_PASSWORD
      remoteRef:
        key: devops-easy-learning/opensis/dev/app
        property: MYSQL_PASSWORD
