apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: opensis-prod

resources:
  - namespace.yaml
  - vault-serviceaccount.yaml
  - vault-secret-store.yaml
  - vault-app-external-secret.yaml
  - vault-db-external-secret.yaml
  - prod-hpa.yaml
  - prod-pdb.yaml
  - ../../base

images:
  - name: opensis-ui
    newName: opensis-ui
    newTag: prod

labels:
  - pairs:
      cluster: k3s
      environment: prod
      secret-source: vault
    includeSelectors: false

patches:
  - target:
      kind: Deployment
      name: opensis-ui
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 768Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "2"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1536Mi
  - target:
      kind: StatefulSet
      name: opensis-db
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "1"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 1536Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "3"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 3Gi
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 40Gi
  - target:
      kind: Deployment
      name: opensis-session-redis
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 50m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 96Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 250m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 256Mi
  - target:
      kind: Ingress
      name: opensis-ui
    patch: |-
      - op: replace
        path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.entrypoints
        value: web,websecure
      - op: replace
        path: /spec/rules/0/host
        value: opensis.prod.example.com
      - op: add
        path: /spec/tls
        value:
          - hosts:
              - opensis.prod.example.com
            secretName: opensis-prod-tls
