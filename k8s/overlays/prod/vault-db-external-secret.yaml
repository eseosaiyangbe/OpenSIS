apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opensis-db-secrets-external
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: opensis-db-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        db.env: |
          MYSQL_ROOT_PASSWORD={{ .MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE={{ .MYSQL_DATABASE }}
          MYSQL_USER={{ .MYSQL_USER }}
          MYSQL_PASSWORD={{ .MYSQL_PASSWORD }}
          MYSQL_EXPORTER_USER={{ .MYSQL_EXPORTER_USER }}
          MYSQL_EXPORTER_PASSWORD={{ .MYSQL_EXPORTER_PASSWORD }}
  data:
    - secretKey: MYSQL_ROOT_PASSWORD
      remoteRef:
        key: devops-easy-learning/opensis/prod/db
        property: MYSQL_ROOT_PASSWORD
    - secretKey: MYSQL_DATABASE
      remoteRef:
        key: devops-easy-learning/opensis/prod/db
        property: MYSQL_DATABASE
    - secretKey: MYSQL_USER
      remoteRef:
        key: devops-easy-learning/opensis/prod/db
        property: MYSQL_USER
    - secretKey: MYSQL_PASSWORD
      remoteRef:
        key: devops-easy-learning/opensis/prod/db
        property: MYSQL_PASSWORD
    - secretKey: MYSQL_EXPORTER_USER
      remoteRef:
        key: devops-easy-learning/opensis/prod/db
        property: MYSQL_EXPORTER_USER
    - secretKey: MYSQL_EXPORTER_PASSWORD
      remoteRef:
        key: devops-easy-learning/opensis/prod/db
        property: MYSQL_EXPORTER_PASSWORD
