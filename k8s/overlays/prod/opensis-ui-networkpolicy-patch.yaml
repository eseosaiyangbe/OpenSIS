apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opensis-ui
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare
        - podSelector:
            matchLabels:
              app: blackbox-exporter
      ports:
        - protocol: TCP
          port: 80
