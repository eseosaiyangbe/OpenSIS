apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opensis-ui
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - opensis.example.com
      secretName: opensis-ui-tls
  rules:
    - host: opensis.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opensis-ui
                port:
                  number: 80
