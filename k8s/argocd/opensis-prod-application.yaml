apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opensis-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/eseosaiyangbe/OpenSIS.git
    targetRevision: main
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: opensis-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
