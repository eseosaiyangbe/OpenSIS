apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/auth-path: "auth/kubernetes"
        vault.hashicorp.com/role: "opensis-cloudflare"
        vault.hashicorp.com/secret-volume-path: "/run/secrets"
        vault.hashicorp.com/agent-inject-secret-cloudflare.env: "kv/data/production/cloudflare"
        vault.hashicorp.com/agent-inject-template-cloudflare.env: |
          {{- with secret "kv/data/production/cloudflare" -}}
          TUNNEL_TOKEN={{ .Data.data.TUNNEL_TOKEN }}
          {{- end }}
    spec:
      serviceAccountName: cloudflared
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.2.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              . /run/secrets/cloudflare.env
              : "${TUNNEL_TOKEN:?Missing TUNNEL_TOKEN}"
              exec cloudflared tunnel --no-autoupdate --metrics 0.0.0.0:2000 run --token "$TUNNEL_TOKEN"
          ports:
            - name: metrics
              containerPort: 2000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
