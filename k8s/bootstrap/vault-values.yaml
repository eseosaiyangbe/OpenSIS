server:
  enabled: true
  standalone:
    enabled: true
    config: |
      ui = true

      listener "tcp" {
        address         = "[::]:8200"
        cluster_address = "[::]:8201"
        tls_disable     = 1
      }

      storage "file" {
        path = "/vault/data"
      }
  dataStorage:
    enabled: true
    size: 10Gi

injector:
  enabled: true

ui:
  enabled: true
  serviceType: ClusterIP

authDelegator:
  enabled: true
