apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opensis-ui
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: opensis.placeholder.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opensis-ui
                port:
                  number: 80

