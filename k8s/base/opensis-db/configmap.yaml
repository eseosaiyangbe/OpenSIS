apiVersion: v1
kind: ConfigMap
metadata:
  name: opensis-db-config
data:
  strict_mode.cnf: |
    [mysqld]
    sql_mode=NO_ENGINE_SUBSTITUTION
    explicit_defaults_for_timestamp=1
  mariadb-entrypoint.sh: |
    #!/usr/bin/env bash
    set -e

    SECRETS_FILE="/run/secrets/db.env"

    until [ -s "$SECRETS_FILE" ]; do
      sleep 2
    done

    set -a
    . "$SECRETS_FILE"
    set +a

    exec docker-entrypoint.sh mysqld

