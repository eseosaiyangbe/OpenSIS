apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensis-vault-synthetic-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensis-vault-synthetic-exporter
  template:
    metadata:
      labels:
        app: opensis-vault-synthetic-exporter
    spec:
      serviceAccountName: opensis-vault-reader
      volumes:
        - name: observability-scripts
          configMap:
            name: opensis-observability-scripts
            defaultMode: 0755
        - name: vault-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: vault
                  expirationSeconds: 3600
                  path: token
      containers:
        - name: vault-synthetic-exporter
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /opt/opensis/vault-synthetic-exporter.py
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: opensis-app-config
                  key: APP_ENV
            - name: VAULT_ADDR
              value: http://vault.vault.svc.cluster.local:8200
            - name: VAULT_K8S_ROLE
              valueFrom:
                configMapKeyRef:
                  name: opensis-app-config
                  key: VAULT_K8S_ROLE
            - name: PORT
              value: "9105"
            - name: VAULT_K8S_TOKEN_FILE
              value: /var/run/secrets/vault/token
          volumeMounts:
            - name: observability-scripts
              mountPath: /opt/opensis/vault-synthetic-exporter.py
              subPath: vault-synthetic-exporter.py
              readOnly: true
            - name: vault-token
              mountPath: /var/run/secrets/vault
              readOnly: true
          ports:
            - name: metrics
              containerPort: 9105
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 15m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: opensis-vault
spec:
  selector:
    app: opensis-vault-synthetic-exporter
  ports:
    - name: metrics
      port: 9105
      targetPort: metrics
