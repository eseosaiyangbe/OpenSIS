apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensis-session-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensis-session-redis
  template:
    metadata:
      labels:
        app: opensis-session-redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 15m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: opensis-session-redis
spec:
  selector:
    app: opensis-session-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
