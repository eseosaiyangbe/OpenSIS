apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensis-mysqld-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensis-mysqld-exporter
  template:
    metadata:
      labels:
        app: opensis-mysqld-exporter
    spec:
      serviceAccountName: opensis-mysqld-exporter
      containers:
        - name: mysqld-exporter
          image: prom/mysqld-exporter:v0.17.2
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - /usr/local/bin/mysqld-exporter-entrypoint.sh
          env:
            - name: MYSQL_EXPORTER_HOST
              value: opensis-db
            - name: MYSQL_EXPORTER_PORT
              value: "3306"
          volumeMounts:
            - name: db-secrets
              mountPath: /opt/opensis/secrets
              readOnly: true
            - name: observability-scripts
              mountPath: /usr/local/bin/mysqld-exporter-entrypoint.sh
              subPath: mysqld-exporter-entrypoint.sh
              readOnly: true
          ports:
            - name: metrics
              containerPort: 9104
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 15m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: db-secrets
          secret:
            secretName: opensis-db-secrets
        - name: observability-scripts
          configMap:
            name: opensis-observability-scripts
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: opensis-mariadb
spec:
  selector:
    app: opensis-mysqld-exporter
  ports:
    - name: metrics
      port: 9104
      targetPort: metrics
