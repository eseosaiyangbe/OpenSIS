apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opensis-ui
spec:
  podSelector:
    matchLabels:
      app: opensis-ui
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
        - podSelector:
            matchLabels:
              app: opensis-apache-exporter
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - platform-observability-dev
                  - platform-observability-prod
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - blackbox-exporter
      ports:
        - protocol: TCP
          port: 80
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: opensis-db
      ports:
        - protocol: TCP
          port: 3306
    - to:
        - podSelector:
            matchLabels:
              app: opensis-session-redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opensis-db
spec:
  podSelector:
    matchLabels:
      app: opensis-db
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: opensis-ui
        - podSelector:
            matchLabels:
              app: opensis-mysqld-exporter
        - podSelector:
            matchLabels:
              app: opensis-db-backup
      ports:
        - protocol: TCP
          port: 3306
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opensis-observability-exporters
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - opensis-mysqld-exporter
          - opensis-apache-exporter
          - opensis-vault-synthetic-exporter
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - platform-observability-dev
                  - platform-observability-prod
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9104
        - protocol: TCP
          port: 9105
        - protocol: TCP
          port: 9117
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opensis-session-redis
spec:
  podSelector:
    matchLabels:
      app: opensis-session-redis
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: opensis-ui
      ports:
        - protocol: TCP
          port: 6379
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
