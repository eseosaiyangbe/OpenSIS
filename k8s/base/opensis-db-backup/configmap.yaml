apiVersion: v1
kind: ConfigMap
metadata:
  name: opensis-db-backup-config
data:
  backup.sh: |
    #!/usr/bin/env sh
    set -eu

    SECRETS_FILE="${SECRETS_FILE:-/run/secrets/db.env}"
    BACKUP_DIR="${BACKUP_DIR:-/backup}"
    RETENTION_DAYS="${RETENTION_DAYS:-7}"
    DUMP_HOST="${DUMP_HOST:-opensis-db}"
    DUMP_PORT="${DUMP_PORT:-3306}"
    TIMESTAMP="$(date +%Y%m%d-%H%M%S)"
    ARCHIVE="${BACKUP_DIR}/opensis-${TIMESTAMP}.sql.gz"

    until [ -s "$SECRETS_FILE" ]; do
      sleep 2
    done

    set -a
    . "$SECRETS_FILE"
    set +a

    mkdir -p "$BACKUP_DIR"

    mysqldump       --host="$DUMP_HOST"       --port="$DUMP_PORT"       --user=root       --password="$MYSQL_ROOT_PASSWORD"       --single-transaction       --quick       --routines       --triggers       --events       --databases "$MYSQL_DATABASE"       | gzip -9 > "$ARCHIVE"

    if [ ! -s "$ARCHIVE" ]; then
      echo "ERROR: backup archive was not created or is empty" >&2
      rm -f "$ARCHIVE"
      exit 1
    fi

    if ! gzip -dc "$ARCHIVE" | grep -Eq '^USE `|^CREATE TABLE `|^INSERT INTO `'; then
      echo "ERROR: backup archive does not contain expected schema or data markers" >&2
      rm -f "$ARCHIVE"
      exit 1
    fi

    find "$BACKUP_DIR" -type f -name 'opensis-*.sql.gz' -mtime +"$RETENTION_DAYS" -delete

    echo "Backup written to $ARCHIVE"
