apiVersion: batch/v1
kind: CronJob
metadata:
  name: opensis-db-backup
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: opensis-db-backup
          annotations:
            vault.hashicorp.com/agent-inject: "true"
            vault.hashicorp.com/agent-pre-populate-only: "true"
            vault.hashicorp.com/auth-path: "auth/kubernetes"
            vault.hashicorp.com/role: "opensis-db-backup"
            vault.hashicorp.com/secret-volume-path: "/run/secrets"
            vault.hashicorp.com/agent-inject-secret-db.env: "kv/data/production/opensis-db"
            vault.hashicorp.com/agent-inject-template-db.env: |
              {{- with secret "kv/data/production/opensis-db" -}}
              MYSQL_ROOT_PASSWORD={{ .Data.data.MYSQL_ROOT_PASSWORD }}
              MYSQL_DATABASE={{ .Data.data.MYSQL_DATABASE }}
              MYSQL_USER={{ .Data.data.MYSQL_USER }}
              MYSQL_PASSWORD={{ .Data.data.MYSQL_PASSWORD }}
              {{- end }}
        spec:
          serviceAccountName: opensis-db-backup
          restartPolicy: OnFailure
          volumes:
            - name: backup-script
              configMap:
                name: opensis-db-backup-config
                defaultMode: 0755
            - name: backup-storage
              persistentVolumeClaim:
                claimName: opensis-db-backup-storage
          containers:
            - name: mariadb-backup
              image: mariadb:10.11.7
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - /usr/local/bin/backup.sh
              env:
                - name: BACKUP_DIR
                  value: /backup
                - name: RETENTION_DAYS
                  value: "7"
                - name: DUMP_HOST
                  value: opensis-db
                - name: DUMP_PORT
                  value: "3306"
              volumeMounts:
                - name: backup-script
                  mountPath: /usr/local/bin/backup.sh
                  subPath: backup.sh
                - name: backup-storage
                  mountPath: /backup
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
