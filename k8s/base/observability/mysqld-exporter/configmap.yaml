apiVersion: v1
kind: ConfigMap
metadata:
  name: mysqld-exporter-config
data:
  run-mysqld-exporter.sh: |
    #!/usr/bin/env sh
    set -eu

    SECRETS_FILE="${SECRETS_FILE:-/run/secrets/db.env}"
    DB_HOST="${DB_HOST:-opensis-db}"
    DB_PORT="${DB_PORT:-3306}"
    DB_WAIT_TIMEOUT="${DB_WAIT_TIMEOUT:-60}"

    until [ -s "$SECRETS_FILE" ]; do
      sleep 2
    done

    set -a
    . "$SECRETS_FILE"
    set +a

    ATTEMPT=0
    until nc -z "$DB_HOST" "$DB_PORT" >/dev/null 2>&1; do
      ATTEMPT=$((ATTEMPT + 1))
      if [ "$ATTEMPT" -ge "$DB_WAIT_TIMEOUT" ]; then
        echo "ERROR: MariaDB at ${DB_HOST}:${DB_PORT} did not become reachable within ${DB_WAIT_TIMEOUT} seconds" >&2
        exit 1
      fi
      sleep 1
    done

    cat > /tmp/.mysqld-exporter.cnf <<CNF
    [client]
    host=${DB_HOST}
    port=${DB_PORT}
    user=root
    password=${MYSQL_ROOT_PASSWORD}
    CNF

    exec /bin/mysqld_exporter \
      --config.my-cnf=/tmp/.mysqld-exporter.cnf \
      --web.listen-address=:9104
