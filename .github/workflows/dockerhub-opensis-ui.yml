name: Build And Push openSIS UI

on:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - "v*"
    paths:
      - 'Dockerfile'
      - 'app/**'
      - 'docker/**'
      - 'scripts/docker-entrypoint-vault.sh'
  workflow_dispatch:
    inputs:
      publish_dev_alias:
        description: Also publish the mutable dev alias
        required: false
        type: boolean
        default: true
      publish_prod_alias:
        description: Also publish the mutable prod/latest aliases
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      REGISTRY: docker.io
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve image repository
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
        run: |
          set -eu

          if [ -z "${DOCKERHUB_USERNAME:-}" ]; then
            echo "DOCKERHUB_USERNAME GitHub variable is required" >&2
            exit 1
          fi

          IMAGE_REPOSITORY="${DOCKERHUB_REPOSITORY:-opensis-ui}"
          echo "IMAGE_NAME=${DOCKERHUB_USERNAME}/${IMAGE_REPOSITORY}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=git-
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.publish_dev_alias) }}
            type=raw,value=prod,enable=${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_prod_alias) }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_prod_alias) }}

      - name: Resolve immutable scan tag
        run: |
          set -eu
          SCAN_IMAGE=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | grep ':git-' | head -n 1)
          if [ -z "${SCAN_IMAGE:-}" ]; then
            echo "Unable to resolve immutable git-<sha> tag for scanning" >&2
            exit 1
          fi
          echo "SCAN_IMAGE=$SCAN_IMAGE" >> "$GITHUB_ENV"


      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: ${{ env.SCAN_IMAGE }}
          format: table
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Summarize published tags
        run: |
          {
            echo "## openSIS UI image policy"
            echo
            echo "- main branch publishes: `main`, `git-<sha>`, and mutable `dev`"
            echo "- version tags (`v*`) publish: the version tag itself, `git-<sha>`, mutable `prod`, and `latest`"
            echo "- production manifests should stay pinned to immutable tags even though CI can publish mutable aliases"
          } >> "$GITHUB_STEP_SUMMARY"
