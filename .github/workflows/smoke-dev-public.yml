name: Smoke Test Public Dev Edge

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  smoke-public-dev:
    runs-on: ubuntu-latest
    env:
      PUBLIC_URL: https://opensis.eseosadevbox.com
    steps:
      - name: Check public dev root and installer page
        run: |
          set -euo pipefail

          ROOT_HEADERS='public-root-headers.txt'
          INSTALL_HEADERS='public-install-headers.txt'
          INSTALL_BODY='public-install-body.html'

          ROOT_CODE=$(curl -k -sS -o /dev/null -D "$ROOT_HEADERS" -w '%{http_code}' "${PUBLIC_URL}/")
          INSTALL_CODE=$(curl -k -sS -o "$INSTALL_BODY" -D "$INSTALL_HEADERS" -w '%{http_code}' "${PUBLIC_URL}/install/")

          {
            echo '## Public dev smoke result'
            echo
            printf -- '- url: %s\n' "$PUBLIC_URL"
            printf -- '- root status: %s\n' "$ROOT_CODE"
            printf -- '- installer status: %s\n' "$INSTALL_CODE"
            printf -- '- installer contract: %s\n' '200 with openSIS installer content'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ROOT_CODE" != '200' ]; then
            echo 'Unexpected root status code' >&2
            cat "$ROOT_HEADERS" >&2
            exit 1
          fi

          if [ "$INSTALL_CODE" != '200' ]; then
            echo 'Unexpected installer status code' >&2
            cat "$INSTALL_HEADERS" >&2
            exit 1
          fi

          if ! grep -q '<title>openSIS Installer</title>' "$INSTALL_BODY"; then
            echo 'Installer page did not render expected title' >&2
            sed -n '1,80p' "$INSTALL_BODY" >&2
            exit 1
          fi

          if ! grep -q 'src="Step0.php"' "$INSTALL_BODY"; then
            echo 'Installer page did not render expected Step0 bootstrap iframe' >&2
            sed -n '1,80p' "$INSTALL_BODY" >&2
            exit 1
          fi

      - name: Upload public smoke headers
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-dev-smoke-${{ github.run_id }}
          path: |
            public-root-headers.txt
            public-install-headers.txt
            public-install-body.html
          retention-days: 14
