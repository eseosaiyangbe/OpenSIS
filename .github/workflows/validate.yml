name: Validate Repository

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'k8s/**'
      - 'scripts/**'
      - 'Dockerfile'
      - '*.yml'
      - '*.yaml'
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - '.github/workflows/**'
      - 'k8s/**'
      - 'scripts/**'
      - 'Dockerfile'
      - '*.yml'
      - '*.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: Install validation tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-pip
          python3 -m pip install --user yamllint
          ACTIONLINT_VERSION=1.7.7
          curl -sSL -o /tmp/actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tgz -C /tmp
          sudo install /tmp/actionlint /usr/local/bin/actionlint

      - name: Lint GitHub Actions workflows
        run: |
          set -euo pipefail
          actionlint

      - name: Lint shell scripts
        env:
          DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          scripts=()
          if [ -n "${DIFF_BASE:-}" ] && git rev-parse --verify "${DIFF_BASE}^{commit}" >/dev/null 2>&1; then
            mapfile -t scripts < <(
              git diff --name-only "${DIFF_BASE}" "${DIFF_HEAD}" -- \
                'scripts/*.sh' 'scripts/**/*.sh' \
                'tests/k8s/*.sh' 'tests/k8s/**/*.sh' \
                'observability/*.sh' 'observability/**/*.sh' | sort -u
            )
          fi
          if [ "${#scripts[@]}" -eq 0 ]; then
            for script in scripts/smoke-dev.sh scripts/smoke-prod.sh; do
              [ -f "${script}" ] && scripts+=("${script}")
            done
          fi
          if [ "${#scripts[@]}" -gt 0 ]; then
            shellcheck "${scripts[@]}"
            for script in "${scripts[@]}"; do
              bash -n "${script}"
            done
          fi

      - name: Lint YAML files
        run: |
          set -euo pipefail
          mapfile -t yaml_files < <(
            {
              find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \)
              find k8s -type f \( -name '*.yml' -o -name '*.yaml' \)
              find observability -type f \( -name '*.yml' -o -name '*.yaml' \)
              find cloudflared -type f \( -name '*.yml' -o -name '*.yaml' \)
              find tests -type f \( -name '*.yml' -o -name '*.yaml' \)
            } | sort -u
          )
          if [ "${#yaml_files[@]}" -gt 0 ]; then
            python3 -m yamllint -c .yamllint.yml -s "${yaml_files[@]}"
          fi

      - name: Render Kubernetes base and overlays
        run: |
          set -euo pipefail
          kubectl kustomize k8s/base >/tmp/kustomize-base.yaml
          kubectl kustomize k8s/overlays/dev >/tmp/kustomize-dev.yaml
          kubectl kustomize k8s/overlays/prod >/tmp/kustomize-prod.yaml
          kubectl kustomize k8s-legacy-platform/platform/cloudflare >/tmp/kustomize-cloudflare.yaml
          kubectl kustomize k8s-legacy-platform/gitops/argocd >/tmp/kustomize-argocd.yaml

      - name: Validate manifest document structure
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import yaml

          files = [
              "/tmp/kustomize-base.yaml",
              "/tmp/kustomize-dev.yaml",
              "/tmp/kustomize-prod.yaml",
              "/tmp/kustomize-cloudflare.yaml",
              "/tmp/kustomize-argocd.yaml",
              "k8s/argocd/opensis-dev-application.yaml",
              "k8s/argocd/opensis-prod-application.yaml",
          ]

          for file_path in files:
              with open(file_path, "r", encoding="utf-8") as handle:
                  docs = [doc for doc in yaml.safe_load_all(handle) if doc is not None]
              if not docs:
                  raise SystemExit(f"{file_path}: no YAML documents found")
              for index, doc in enumerate(docs, start=1):
                  if not isinstance(doc, dict):
                      raise SystemExit(f"{file_path}: document {index} is not a YAML object")
                  if not doc.get("apiVersion") or not doc.get("kind"):
                      raise SystemExit(f"{file_path}: document {index} is missing apiVersion or kind")
                  metadata = doc.get("metadata")
                  if not isinstance(metadata, dict) or not metadata.get("name"):
                      raise SystemExit(f"{file_path}: document {index} is missing metadata.name")

          print(f"Validated {len(files)} manifest files")
          PY

      - name: Summarize validation coverage
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Validation Coverage

          - GitHub Actions workflow linting via `actionlint`
          - Shell script linting via `shellcheck` and `bash -n`
          - YAML linting via `yamllint`
          - Kustomize render checks for base, dev, prod, legacy cloudflare, and legacy argocd
          - Offline YAML document checks for rendered overlays and Argo CD application manifests
          EOF
