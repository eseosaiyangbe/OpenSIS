name: Validate Repository

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - '.github/workflows/**'
      - 'k8s/**'
      - 'scripts/**'
      - 'Dockerfile'
      - '*.yml'
      - '*.yaml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Install validation tools
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-pip
          python3 -m pip install --user yamllint
          ACTIONLINT_VERSION=1.7.7
          curl -sSL -o /tmp/actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tgz -C /tmp
          sudo install /tmp/actionlint /usr/local/bin/actionlint

      - name: Lint GitHub Actions workflows
        run: |
          set -eu
          actionlint

      - name: Lint shell scripts
        run: |
          set -eu
          mapfile -t scripts < <(find scripts -type f -name '*.sh' | sort)
          if [ "${#scripts[@]}" -gt 0 ]; then
            shellcheck "${scripts[@]}"
          fi

      - name: Lint YAML files
        run: |
          set -eu
          mapfile -t yaml_files < <(git ls-files '*.yml' '*.yaml')
          if [ "${#yaml_files[@]}" -gt 0 ]; then
            python3 -m yamllint -c .yamllint.yml -s "${yaml_files[@]}"
          fi

      - name: Render Kubernetes base and overlays
        run: |
          set -eu
          kubectl kustomize k8s/base >/tmp/kustomize-base.yaml
          kubectl kustomize k8s/overlays/dev >/tmp/kustomize-dev.yaml
          kubectl kustomize k8s/overlays/prod >/tmp/kustomize-prod.yaml
          kubectl kustomize k8s/platform/cloudflare >/tmp/kustomize-cloudflare.yaml
          kubectl kustomize k8s/gitops/argocd >/tmp/kustomize-argocd.yaml

      - name: Summarize validation coverage
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Validation Coverage

          - GitHub Actions workflow linting via `actionlint`
          - Shell script linting via `shellcheck`
          - YAML linting via `yamllint`
          - Kustomize render checks for base, dev, prod, cloudflare, and argocd
          EOF
