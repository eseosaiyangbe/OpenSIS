apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: vault-selfsigned
  namespace: vault
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-selfsigned-ca
  namespace: vault
spec:
  isCA: true
  commonName: Vault Local CA
  secretName: vault-ca-secret
  duration: 87660h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: vault-selfsigned
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: vault-ca-issuer
  namespace: vault
spec:
  ca:
    secretName: vault-ca-secret
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-server-certificate
  namespace: vault
spec:
  secretName: vault-server-tls
  duration: 2160h
  renewBefore: 360h
  commonName: vault.vault.svc
  dnsNames:
    - vault
    - vault.vault
    - vault.vault.svc
    - vault.vault.svc.cluster.local
    - vault-internal
    - vault-internal.vault
    - vault-internal.vault.svc
    - vault-internal.vault.svc.cluster.local
    - "*.vault-internal"
    - "*.vault-internal.vault"
    - "*.vault-internal.vault.svc"
    - "*.vault-internal.vault.svc.cluster.local"
  issuerRef:
    name: vault-ca-issuer
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: injector-certificate
  namespace: vault
spec:
  secretName: injector-tls
  duration: 2160h
  renewBefore: 360h
  commonName: vault-agent-injector-svc.vault.svc
  dnsNames:
    - vault-agent-injector-svc
    - vault-agent-injector-svc.vault
    - vault-agent-injector-svc.vault.svc
    - vault-agent-injector-svc.vault.svc.cluster.local
  issuerRef:
    name: vault-ca-issuer
    kind: Issuer
    group: cert-manager.io
