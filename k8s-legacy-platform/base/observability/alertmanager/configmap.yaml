apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
data:
  alertmanager.yml.tmpl: |
    global:
      resolve_timeout: 5m

    route:
      group_by: ['alertname', 'job', 'instance']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: default
      routes:
        - matchers:
            - severity=~"warning|critical"
          receiver: slack

    receivers:
      - name: default
      - name: slack
        slack_configs:
          - api_url: '__SLACK_WEBHOOK_URL__'
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
            text: >-
              {{ range .Alerts }}
              *Summary:* {{ .Annotations.summary }}
              *Description:* {{ .Annotations.description }}
              *Severity:* {{ .Labels.severity }}
              *Job:* {{ .Labels.job }}
              *Instance:* {{ .Labels.instance }}
              {{ end }}

    inhibit_rules:
      - source_matchers:
          - severity="critical"
        target_matchers:
          - severity="warning"
        equal: ['alertname', 'job', 'instance']
