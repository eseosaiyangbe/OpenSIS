apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opensis-kube-state-metrics
rules:
  - apiGroups: [""]
    resources: ["configmaps", "nodes", "pods", "services", "persistentvolumeclaims", "namespaces"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "replicasets", "statefulsets"]
    verbs: ["list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["list", "watch"]
