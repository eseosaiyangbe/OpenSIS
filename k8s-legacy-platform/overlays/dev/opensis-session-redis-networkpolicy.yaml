apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opensis-session-redis
spec:
  podSelector:
    matchLabels:
      app: opensis-session-redis
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: opensis-ui
      ports:
        - protocol: TCP
          port: 6379
  egress: []
