apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensis-ui
spec:
  replicas: 1
  template:
    metadata:
      annotations:
        vault.hashicorp.com/role: opensis-app-dev
        vault.hashicorp.com/agent-inject-secret-app.env: kv/data/dev/opensis-app
        vault.hashicorp.com/agent-inject-template-app.env: |
          {{- with secret "kv/data/dev/opensis-app" -}}
          MYSQL_DATABASE={{ .Data.data.MYSQL_DATABASE }}
          MYSQL_USER={{ .Data.data.MYSQL_USER }}
          MYSQL_PASSWORD={{ .Data.data.MYSQL_PASSWORD }}
          DB_HOST={{ .Data.data.DB_HOST }}
          DB_PORT={{ .Data.data.DB_PORT }}
          {{- end }}
    spec:
      containers:
        - name: opensis-ui
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 750m
              memory: 768Mi
