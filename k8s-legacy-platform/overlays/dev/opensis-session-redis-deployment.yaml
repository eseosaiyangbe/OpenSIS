apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensis-session-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensis-session-redis
  template:
    metadata:
      labels:
        app: opensis-session-redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - containerPort: 6379
              name: redis
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 15m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 128Mi
