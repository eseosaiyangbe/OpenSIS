services:

  # -----------------------------
  # FIX: Volume permissions (Vault data)
  # -----------------------------
  vault-volume-init:
    image: alpine:3.20
    container_name: vault-volume-init
    restart: "no"

    command: >
      sh -c "
        chown -R 1000:1000 /vault_data
      "

    volumes:
      - vault_data:/vault_data

    networks:
      - backend-network


  # -----------------------------
  # FIX: Permissions for bind mount (vault-agent)
  # -----------------------------
  vault-agent-init:
    image: alpine:3.20
    container_name: vault-agent-init
    restart: "no"

    command: >
      sh -c "
        chown -R 1000:1000 /vault-agent
      "

    volumes:
      - ./vault-agent:/vault-agent

    networks:
      - backend-network

  # -----------------------------
  # AppRole volume init
  # -----------------------------
  approle-volume-init:
    image: alpine:3.20
    container_name: approle-volume-init
    restart: "no"

    command: >
      sh -c "
        chown -R 1000:1000 /app_approle /db_approle
      "

    volumes:
      - app_runtime_approle:/app_approle
      - db_runtime_approle:/db_approle

    networks:
      - backend-network


  # -----------------------------
  # Vault Server
  # -----------------------------
  vault:
    image: hashicorp/vault:1.15
    container_name: vault
    restart: unless-stopped
    user: "1000:1000"

    entrypoint: ["vault"]
    command: ["server", "-config=/vault/config/vault.hcl"]

    cap_add:
      - IPC_LOCK

    ports:
      - "127.0.0.1:8200:8200"

    volumes:
      - ./vault/config:/vault/config:ro
      - vault_data:/vault/data

    depends_on:
      vault-volume-init:
        condition: service_completed_successfully

    # FIX: Proper API healthcheck (not just port check)
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8200"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - backend-network
      - frontend-network


  # -----------------------------
  # Vault Bootstrap (Init + Unseal + AppRole)
  # -----------------------------
  vault-bootstrap:
    build:
      context: .
      dockerfile: vault-bootstrap/Dockerfile

    container_name: vault-bootstrap
    restart: "no"

    depends_on:
      vault-volume-init:
        condition: service_completed_successfully
      approle-volume-init:
        condition: service_completed_successfully
      vault-agent-init:
        condition: service_completed_successfully
      vault:
        condition: service_healthy

    volumes:
      - vault_data:/vault/data
      - ./vault-bootstrap/policies:/policies:ro
      - ./scripts/bootstrap.sh:/bootstrap.sh:ro
      - app_runtime_approle:/approle-app
      - db_runtime_approle:/approle-db

    environment:
      APP_APPROLE_DIR: /approle-app
      DB_APPROLE_DIR: /approle-db

    networks:
      - backend-network


  # -----------------------------
  # Vault Seed (Secrets Injection)
  # -----------------------------
  vault-seed:
    build:
      context: .
      dockerfile: vault-seed/Dockerfile

    container_name: vault-seed
    restart: "no"

    depends_on:
      vault-bootstrap:
        condition: service_completed_successfully

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - vault_data:/vault/data

    networks:
      - backend-network


  # -----------------------------
  # Vault Agent (DB)
  # -----------------------------
  vault-agent-db:
    image: hashicorp/vault:1.15
    container_name: vault-agent-db
    restart: unless-stopped
    user: "1000:1000"

    entrypoint: ["vault"]
    command: ["agent", "-config=/vault/agent/agent-db.hcl"]

    cap_add:
      - IPC_LOCK

    depends_on:
      vault:
        condition: service_healthy
      vault-bootstrap:
        condition: service_completed_successfully

    environment:
      APP_ENV: ${APP_ENV}

    volumes:
      - ./vault-agent/db-config:/vault/agent:ro
      - ./vault-agent/db-templates:/vault/templates:ro
      - db_runtime_approle:/vault/approle
      - db_runtime_secrets:/vault/secrets

    networks:
      - backend-network


  # -----------------------------
  # Vault Agent (App)
  # -----------------------------
  vault-agent-app:
    image: hashicorp/vault:1.15
    container_name: vault-agent-app
    restart: unless-stopped
    user: "1000:1000"

    entrypoint: ["vault"]
    command: ["agent", "-config=/vault/agent/agent-app.hcl"]

    cap_add:
      - IPC_LOCK

    depends_on:
      vault:
        condition: service_healthy
      vault-bootstrap:
        condition: service_completed_successfully

    environment:
      APP_ENV: ${APP_ENV}

    volumes:
      - ./vault-agent/app-config:/vault/agent:ro
      - ./vault-agent/app-templates:/vault/templates:ro
      - app_runtime_approle:/vault/approle
      - app_runtime_secrets:/vault/secrets

    networks:
      - backend-network

  # -----------------------------
  # Vault Synthetic Metrics Exporter
  # -----------------------------
  vault-synthetic-exporter:
    image: python:3.12-alpine
    container_name: opensis-vault-synthetic-exporter
    restart: unless-stopped

    depends_on:
      vault:
        condition: service_healthy
      vault-bootstrap:
        condition: service_completed_successfully

    command: ["python", "/opt/opensis/vault-synthetic-exporter.py"]

    environment:
      APP_ENV: ${APP_ENV}
      VAULT_ADDR: http://vault:8200
      PORT: 9105

    volumes:
      - ./observability/vault-synthetic-exporter.py:/opt/opensis/vault-synthetic-exporter.py:ro
      - app_runtime_approle:/vault/approle-app:ro
      - db_runtime_approle:/vault/approle-db:ro

    expose:
      - "9105"

    networks:
      backend-network:
      observability-net:
        aliases:
          - opensis-vault-checker

  # -----------------------------
  # Database
  # -----------------------------
  opensis-db:
    image: mariadb:10.11.7
    container_name: opensis-db
    restart: unless-stopped

    depends_on:
      vault-agent-db:
        condition: service_started

    entrypoint: ["/usr/local/bin/mariadb-entrypoint.sh"]

    volumes:
      - db_data:/var/lib/mysql
      - ./MYSQL/mysql-config/strict_mode.cnf:/etc/mysql/conf.d/strict_mode.cnf:ro
      - ./scripts/mariadb-entrypoint.sh:/usr/local/bin/mariadb-entrypoint.sh:ro
      - db_runtime_secrets:/run/secrets:ro

    environment:
      MYSQL_EXPORTER_USER: ${MYSQL_EXPORTER_USER:-opensis_exporter}
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:-change-me-exporter}

    healthcheck:
      test:
        [
          "CMD-SHELL",
          ". /run/secrets/db.env && mysqladmin ping -h 127.0.0.1 -u root -p\"$MYSQL_ROOT_PASSWORD\" --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - backend-network

  # -----------------------------
  # MariaDB Metrics Exporter
  # -----------------------------
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.17.2
    container_name: opensis-mysqld-exporter
    restart: unless-stopped

    depends_on:
      opensis-db:
        condition: service_healthy

    entrypoint: ["/usr/local/bin/mysqld-exporter-entrypoint.sh"]

    environment:
      MYSQL_EXPORTER_USER: ${MYSQL_EXPORTER_USER:-opensis_exporter}
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:-change-me-exporter}

    volumes:
      - ./observability/mysqld-exporter-entrypoint.sh:/usr/local/bin/mysqld-exporter-entrypoint.sh:ro

    expose:
      - "9104"

    networks:
      backend-network:
      observability-net:
        aliases:
          - opensis-mysqld-exporter

  # -----------------------------
  # Opensis UI
  # -----------------------------
  opensis-ui:
    image: docker.io/eseosaiyangbe/opensis-ui:dev
    pull_policy: always
    container_name: opensis-ui
    restart: unless-stopped

    depends_on:
      opensis-db:
        condition: service_healthy
      vault-agent-app:
        condition: service_started

    environment:
      APP_ENV: ${APP_ENV}

    volumes:
      - app_runtime_secrets:/run/secrets:ro

    expose:
      - "80"

    ports:
      - "127.0.0.1:8088:80"

    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=frontend-network"
      - "traefik.http.routers.opensis.rule=Host(`opensis.raysosglobal.com`)"
      - "traefik.http.routers.opensis.entrypoints=web"
      - "traefik.http.services.opensis.loadbalancer.server.port=80"

    networks:
      frontend-network:
      backend-network:
      observability-net:
        aliases:
          - opensis-ui

  # -----------------------------
  # Apache Runtime Metrics Exporter
  # -----------------------------
  apache-exporter:
    image: lusotycoon/apache-exporter:v1.0.10
    container_name: opensis-apache-exporter
    restart: unless-stopped

    depends_on:
      opensis-ui:
        condition: service_healthy

    command:
      - "--scrape_uri=http://opensis-ui/server-status?auto"
      - "--web.listen-address=:9117"
      - "--custom_headers=X-OpenSIS-Metrics:apache-exporter"

    expose:
      - "9117"

    networks:
      backend-network:
      observability-net:
        aliases:
          - opensis-apache-exporter

  # -----------------------------
  # Traefik
  # -----------------------------
  traefik:
    image: traefik:v3.6.1
    container_name: traefik
    restart: unless-stopped
    profiles: ["edge"]

    command:
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=frontend-network"
      - "--entrypoints.web.address=:80"
      - "--log.level=DEBUG"
      - "--accesslog=true"
      - "--api.dashboard=true"
      - "--api.insecure=false"

    ports:
      - "127.0.0.1:80:80"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - frontend-network


  # -----------------------------
  # Cloudflare Tunnel
  # -----------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    profiles: ["edge"]

    command: tunnel --config /etc/cloudflared/config.yaml run

    volumes:
      - ./cloudflared:/etc/cloudflared

    depends_on:
      - traefik

    networks:
      - frontend-network


# -----------------------------
# Networks
# -----------------------------
networks:
  frontend-network:
    driver: bridge
    name: frontend-network

  backend-network:
    driver: bridge
    internal: true
    name: backend-network

  observability-net:
    name: observability-net
    external: true


# -----------------------------
# Volumes
# -----------------------------
volumes:
  db_data:
    name: opensis_db_data

  vault_data:
    name: vault_data

  app_runtime_secrets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=1000,gid=1000,mode=0750,size=1m

  db_runtime_secrets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=1000,gid=1000,mode=0750,size=1m

  app_runtime_approle:
    name: app_runtime_approle

  db_runtime_approle:
    name: db_runtime_approle
